name: Build and push Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  delete:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # lfs: true is required so bin/claude-net-plugin-linux-x64 (Git
      # LFS-tracked; see .gitattributes) is checked out as the real
      # binary rather than left as its ~130-byte pointer text. Without
      # this, the image ships the pointer file at that path, and
      # plugin-bin-server.ts would serve it to clients as if it were the
      # binary (see the pointer-detection guard in plugin-bin-server.ts
      # for the server-side backstop against exactly that).
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The Dockerfile's GIT_COMMIT arg feeds CLAUDE_NET_VERSION, which the
      # hub reports in the UI and stamps into the mirror-agent bundle it
      # serves. Left unset it defaults to "dev", so every build looks
      # identical and an installed agent never sees a version change to
      # update itself against.
      - name: Resolve short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.sha.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete branch image tag
        uses: actions/delete-package-versions@v5
        with:
          package-name: claude-net
          package-type: container
          delete-package-tag: ${{ github.event.ref }}
